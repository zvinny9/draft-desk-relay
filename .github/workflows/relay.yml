# Public fantasy inputs only. Never place a personal desk backup in this repo.
name: relay
on:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '47 13-23 * * 0'
  workflow_dispatch:
    inputs:
      all_sources:
        description: 'Also refresh dormant draft sources'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Fetch current public inputs
        env:
          ALL_SOURCES: ${{ inputs.all_sources }}
        run: |
          if [ "$ALL_SOURCES" = 'true' ]; then
            node relay.mjs data --all
          else
            node relay.mjs data
          fi
      - name: Preserve dated evidence
        run: |
          stamp=$(date -u +%F)
          mkdir -p "archive/$stamp"
          cp data/*.json "archive/$stamp/"
      - name: Publish updated JSON
        run: |
          git config user.name 'draft-desk-relay'
          git config user.email 'actions@github.com'
          git add data archive
          if ! git diff --staged --quiet; then
            git commit -m "relay: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push || (git pull --rebase --autostash origin main && git push)
          fi
