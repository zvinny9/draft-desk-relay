# Draft Desk relay.
#
# Runs twice a day, fetches the market sources a browser is refused, and commits
# the JSON into this repo. Draft Desk reads it from raw.githubusercontent.com.
#
# No secrets: GITHUB_TOKEN is issued by Actions for this run only, and every
# source fetched is a public page.
name: relay

on:
  schedule:
    - cron: "17 11,23 * * *"     # 11:17 and 23:17 UTC
  workflow_dispatch:              # and a manual run whenever you want one

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the sources
        run: node relay.mjs data

      - name: Commit whatever changed
        run: |
          git config user.name  "draft-desk-relay"
          git config user.email "actions@github.com"
          git add data
          # Nothing changed is a normal outcome, not a failure.
          git diff --staged --quiet || git commit -m "relay: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # Reconnaissance, not a source. Manual runs only, never fails the job.
      # The question each round is the same: which hosts answer a datacenter IP
      # AND actually contain the thing we want. Round 1 answered it for win
      # totals (VegasInsider). Round 2 asks it for the expert/value sources the
      # board still takes by hand.
      - name: Probe candidate sources
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          node --input-type=module -e '
          const UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36";
          // If a page has the 2026 draft board in it, these surnames are in it.
          const NAMES = ["Gibbs","Bijan","Nacua","Chase","Jefferson","Bowers","Nabers",
            "McBride","Achane","Jeanty","Barkley","Lamb","Hampton","Odunze"];
          const URLS = [
            "https://api.fantasycalc.com/values/current?isDynasty=false&numQbs=1&numTeams=12&ppr=1",
            "https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=2&numTeams=12&ppr=1",
            "https://keeptradecut.com/dynasty-rankings",
            "https://www.fantasypros.com/nfl/adp/ppr-overall.php",
            "https://www.fantasypros.com/nfl/rankings/ppr-cheatsheets.php",
            "https://www.fantasypros.com/nfl/projections/qb.php?scoring=PPR",
            "https://www.draftsharks.com/adp/ppr",
            "https://api.sleeper.app/v1/players/nfl",
            "https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_2026.csv",
            "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_2026.csv"
          ];
          for (const u of URLS) {
            const host = u.split("/")[2] + u.split("/").slice(3).join("/").slice(0, 28);
            try {
              const r = await fetch(u, { headers: { "user-agent": UA, accept: "*/*" }, redirect: "follow" });
              const b = await r.text();
              const hits = NAMES.filter((n) => b.includes(n)).length;
              let json = false; try { JSON.parse(b); json = true; } catch (e) {}
              const rows = (b.match(/<tr[\s\S]*?<\/tr>/gi) || []).length;
              console.log(`PROBE ${host} -> ${r.status}, ${b.length}b, ${hits}/${NAMES.length} names, json=${json}, trs=${rows}`);
            } catch (e) { console.log(`PROBE ${host} -> ${e.message}`); }
          }
          '
