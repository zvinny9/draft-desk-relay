# Draft Desk relay.
#
# Runs twice a day, fetches the market sources a browser is refused, and commits
# the JSON into this repo. Draft Desk reads it from raw.githubusercontent.com.
#
# No secrets: GITHUB_TOKEN is issued by Actions for this run only, and every
# source fetched is a public page.
name: relay

on:
  schedule:
    - cron: "17 11,23 * * *"     # 11:17 and 23:17 UTC
  workflow_dispatch:              # and a manual run whenever you want one

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the sources
        run: node relay.mjs data

      - name: Commit whatever changed
        run: |
          git config user.name  "draft-desk-relay"
          git config user.email "actions@github.com"
          git add data
          # Nothing changed is a normal outcome, not a failure.
          git diff --staged --quiet || git commit -m "relay: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # Reconnaissance, not a source. Manual runs only, never fails the job.
      # Round 1 asked WHICH hosts answer (found VegasInsider). Round 2 asked
      # which contain the player pool (found six). Round 3 asks HOW each one is
      # shaped, so the parsers get written once instead of five times.
      - name: Probe candidate sources
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          node --input-type=module -e '
          const UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36";
          const MARK = "Gibbs";
          const URLS = [
            "https://api.fantasycalc.com/values/current?isDynasty=false&numQbs=1&numTeams=12&ppr=1",
            "https://keeptradecut.com/dynasty-rankings",
            "https://www.fantasypros.com/nfl/rankings/ppr-cheatsheets.php",
            "https://www.draftsharks.com/adp/ppr",
            "https://api.github.com/repos/nflverse/nflverse-data/releases/tags/injuries",
            "https://api.github.com/repos/nflverse/nflverse-data/releases/tags/depth_charts"
          ];
          const clip = (s, n) => String(s).replace(/\s+/g, " ").slice(0, n);
          for (const u of URLS) {
            const tag = u.split("/")[2] + " " + u.split("/").slice(3).join("/").slice(0, 34);
            try {
              const r = await fetch(u, { headers: { "user-agent": UA, accept: "*/*" }, redirect: "follow" });
              const b = await r.text();
              let j = null; try { j = JSON.parse(b); } catch (e) {}
              if (j) {
                if (Array.isArray(j)) {
                  console.log(`SHAPE ${tag} -> ARRAY len=${j.length}`);
                  console.log(`  keys: ${Object.keys(j[0] || {}).join(",")}`);
                  console.log(`  row0: ${clip(JSON.stringify(j[0]), 420)}`);
                } else if (j.assets) {
                  console.log(`SHAPE ${tag} -> RELEASE assets=${j.assets.length}`);
                  console.log(`  ${j.assets.map((a) => a.name).filter((n) => /202[56]|csv/.test(n)).slice(0, 12).join(", ")}`);
                } else {
                  console.log(`SHAPE ${tag} -> OBJECT keys=${Object.keys(j).join(",")}`);
                  console.log(`  ${clip(JSON.stringify(j).slice(0, 400), 400)}`);
                }
                continue;
              }
              // HTML: find where the data actually lives.
              const blobs = ["__NEXT_DATA__", "ecrData", "playersArray", "window.__", "application/ld+json",
                             "var players", "dataLayer", "__NUXT__"].filter((k) => b.includes(k));
              const at = b.indexOf(MARK);
              console.log(`SHAPE ${tag} -> HTML ${b.length}b, blobs=[${blobs.join(",")}], trs=${(b.match(/<tr/gi)||[]).length}`);
              if (at > -1) console.log(`  around "${MARK}": ${clip(b.slice(Math.max(0, at - 220), at + 220), 440)}`);
            } catch (e) { console.log(`SHAPE ${tag} -> ${e.message}`); }
          }
          '
