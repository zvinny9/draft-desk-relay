name: Weekly waiver evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'
permissions:
  contents: write
concurrency:
  group: waiver-evidence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node waiver-evidence.mjs
      # An empty current-week result carries source failure details. Publish it
      # even when the collector signals failure; never leave last week's file
      # looking like the only available status. Fatal preflight errors leave no diff.
      - name: Publish public metadata
        if: always()
        run: |
          test -f data/waiver-evidence.json || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/waiver-evidence.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh dated waiver evidence"
          git pull --rebase
          git push
